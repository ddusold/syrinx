name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

  openapi:
    name: Lint generated OpenAPI (Spectral)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Spectral needs Node 22+
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint:openapi

  runtimes:
    name: Smoke test on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun scripts/smoke.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno run --allow-read --allow-env scripts/smoke.mjs

  conformance:
    name: MCP conformance (2026-07-28 requirements)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start the conformance fixtures
        run: |
          pnpm --filter @syrinx/example-conformance start &
          for i in $(seq 1 60); do
            curl -s -o /dev/null -X POST http://localhost:3001/mcp/conformance && exit 0
            sleep 1
          done
          echo "fixture server did not start" && exit 1
      # Fails on any failure outside examples/conformance/expected-failures.yaml, and on baseline entries that pass.
      - run: pnpm conformance

  views:
    name: Views in a headless browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build # the example server loads the packages from dist
      # Builds the example's views, serves them behind a real MCP Apps host page, and checks three widths.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/

  stores:
    name: Stores against Redis and Postgres
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: syrinx
          POSTGRES_PASSWORD: syrinx
          POSTGRES_DB: syrinx
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U syrinx" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://syrinx:syrinx@localhost:5432/syrinx
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same contract suite the memory store passes, against every shared store; fails if any of them is skipped.
      - run: pnpm test:stores
